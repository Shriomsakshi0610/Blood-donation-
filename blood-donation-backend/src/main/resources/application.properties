spring.application.name=blood-donation-backend
server.port=${PORT:8080}

# Database configuration: defaults to local persistent H2 database for zero-config local development,
# or connects to MySQL in production/Render when DB_URL is provided.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/blood_donation;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Convenient for development. Use Flyway/Liquibase migrations in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Session cookie settings (false for local HTTP, true for HTTPS production)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:Lax}
server.servlet.session.timeout=30m
